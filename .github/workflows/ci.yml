name: CI

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # No OPENAI_API_KEY in CI: the tests exercise the local rule-based path and mock the API.
      - run: pytest -q
